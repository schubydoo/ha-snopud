name: Claude review

# On-demand PR review. The job lives in schubydoo/shared-workflows; this file only calls it.
# See that repo's README for the inputs and secrets. Project rules for the review live in
# .github/claude-review-instructions.md; the central workflow carries the posting recipe.

on:
  # The review is requested by a comment, so this trigger is required. The hardening lives
  # in the called workflow: an exact-command allow list, a guard hook, and a pin to the head SHA.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]

permissions: {}

jobs:
  review:
    # A called workflow cannot hold more permissions than the caller grants.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: schubydoo/shared-workflows/.github/workflows/claude-review.yml@5ddfea231b92a1dc134203d421fd7708edf3f611 # main
    with:
      output-style: simple-english:simple-english
      model: opus
      timeout-minutes: 60
      # ha-snopud has no codecov, so only Greptile is excluded.
      exclude-comments-by-actor: "greptile-apps[bot]"
    secrets:
      app-client-id: ${{ secrets.HA_SNOPUD_CI_CLIENT_ID }}
      app-private-key: ${{ secrets.HA_SNOPUD_CI_APP_PRIVATE_KEY }}
      claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
