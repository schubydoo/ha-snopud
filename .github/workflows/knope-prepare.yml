name: Prepare Release

# The "release PR" half of knope. On a push to main with a pending
# `.changeset/*.md` fragment, knope bumps the version in manifest.json, writes
# CHANGELOG.md, force-pushes the `release` branch, and opens or refreshes a
# `chore: prepare release X.Y.Z` PR. A maintainer approves the release by merging
# that PR. The merge starts knope-release.yml.
#
# This workflow does nothing until the `KNOPE_ENABLED` repo variable is `true`.
# It needs the `ha-snopud-ci` GitHub App installed on the repo, and the
# HA_SNOPUD_CI_CLIENT_ID and HA_SNOPUD_CI_APP_PRIVATE_KEY secrets. It uses a
# short-lived App token and not GITHUB_TOKEN, because GitHub starts no workflow
# for a PR that GITHUB_TOKEN opens. The required checks would then never report
# on the release PR. Only a push with a pending changeset mints the token. Any
# other push uses no credential and does nothing.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: knope-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: ${{ vars.KNOPE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Detect a pending changeset first, credential-less, so a routine push with
      # no fragment is a clean no-op that never touches the ha-snopud-ci App.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect pending changesets
        id: changesets
        run: |
          set -euo pipefail
          count=0
          if [ -d .changeset ]; then
            count=$(find .changeset -maxdepth 1 -name '*.md' ! -iname 'README.md' | wc -l)
          fi
          echo "has=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pending changeset fragments: $count"
      # Short-lived ha-snopud-ci App token, minted only when a fragment is pending.
      # The App identity is what lets CI run on the release PR.
      - name: Mint ha-snopud-ci App token
        id: app-token
        if: ${{ steps.changesets.outputs.has == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HA_SNOPUD_CI_CLIENT_ID }}
          private-key: ${{ secrets.HA_SNOPUD_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Verify App token was minted
        if: ${{ steps.changesets.outputs.has == 'true' && steps.app-token.outputs.token == '' }}
        run: |
          echo "::error::ha-snopud-ci App token mint produced an empty token; check the HA_SNOPUD_CI_CLIENT_ID / HA_SNOPUD_CI_APP_PRIVATE_KEY secrets and the App installation."
          exit 1
      # Re-checkout with the App token persisted so knope's git push of the release
      # branch + the PR it opens run as the App identity. Full history + tags so
      # knope can find the last release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.changesets.outputs.has == 'true' }}
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Configure git identity (ha-snopud-ci App)
        if: ${{ steps.changesets.outputs.has == 'true' }}
        run: |
          git config user.name "ha-snopud-ci[bot]"
          git config user.email "ha-snopud-ci[bot]@users.noreply.github.com"
      - name: Install knope
        if: ${{ steps.changesets.outputs.has == 'true' }}
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          # renovate: datasource=github-releases depName=knope-dev/knope extractVersion=^knope/v(?<version>.+)$
          version: 0.23.0
      - name: Open or refresh the release PR
        if: ${{ steps.changesets.outputs.has == 'true' }}
        # KNOPE_OVERRIDE_VERSION forces a specific version. knope never selects a
        # 1.0 (or later major) graduation from a 0.x line on its own, so set the
        # repo variable to e.g. `1.0.0` for that one release, then clear it —
        # later releases fall back to the changeset-derived version.
        run: |
          if [ -n "${OVERRIDE:-}" ]; then
            knope prepare-release --verbose --override-version "${OVERRIDE}"
          else
            knope prepare-release --verbose
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          OVERRIDE: ${{ vars.KNOPE_OVERRIDE_VERSION }}
