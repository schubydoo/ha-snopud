name: PR Title

# Make sure that the pull request title follows Conventional Commits. The repo
# squash-merges, and the PR title becomes the subject of the squash commit, so
# a conventional title keeps the history of `main` consistent. The title does
# not drive a release. Releases come only from changesets (knope). This check is
# advisory and is not a required check.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            ci
            build
            test
            refactor
            style
