# Release automation for ha-snopud: knope with the changeset model, ported from
# withe.
#
# Every change that a user can see ships a `.changeset/*.md` fragment. The
# fragments, not the commit messages, drive both the version bump and the
# changelog. `knope document-change` writes one. See the "Changesets" section in
# CONTRIBUTING.md. A check enforces Conventional Commits PR titles
# (pr-title.yml) for a consistent history, but knope ignores them.
#
# The release PR half is .github/workflows/knope-prepare.yml, and the publish
# half is knope-release.yml. Both do nothing until the `KNOPE_ENABLED` repo
# variable is `true`. HACS reads the GitHub Release that knope creates, so
# there is no build step and no release asset.

[package]
# Home Assistant and HACS read the version from the integration manifest. The
# entry is a regex and not a plain JSON entry, because knope rewrites a whole
# JSON file, and hassfest checks the key order of manifest.json.
versioned_files = [
  { path = "custom_components/snopud/manifest.json", regex = '"version": "(?<version>\d+\.\d+\.\d+)"' },
]
changelog = "CHANGELOG.md"

# The `default:` value of a fragment selects both the changelog section and the
# version bump. A custom type bumps the patch version.
extra_changelog_sections = [
  { name = "Security", types = ["security"] },
  { name = "Performance", types = ["perf"] },
]

[changes]
ignore_conventional_commits = true # fragments in .changeset/ are the only source

[github]
owner = "schubydoo"
repo = "ha-snopud"

# knope finds the PR that added each changeset file and appends its number. It
# uses the first template whose variables all resolve, so an entry with no
# traceable PR (for example in a local dry run) has no link.
[release_notes]
change_templates = [
  "### $summary ([#$pr_number](https://github.com/schubydoo/ha-snopud/pull/$pr_number))\n\n$details",
  "### $summary\n\n$details",
  "- $summary ([#$pr_number](https://github.com/schubydoo/ha-snopud/pull/$pr_number))",
  "- $summary",
]

# --- prepare-release: open or refresh the `release` PR (run on push to main) ---
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = 'git commit -am "chore: prepare release $version"'

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this PR tags and publishes **v$version**.\n\nknope generated it from the `.changeset/*.md` fragments. Do not edit it by hand.\n\n---\n\n$changelog"

# --- release: create the tag and the GitHub Release on merge of the release PR ---
[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

# --- document-change: write a new .changeset fragment (local convenience) ---
[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
